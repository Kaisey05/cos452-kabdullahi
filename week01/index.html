<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Week 1 Starter — Canvas &amp; Clear Color</title>
  <style>
    html, body { height: 100%; margin: 0; }
    canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <canvas id="gl-canvas"></canvas>
  <script>
    const canvas = document.getElementById("gl-canvas");
    const gl = canvas.getContext("webgl2");

    if (!gl) {
      throw new Error("WebGL2 is not available on this device/browser.");
    }

    function resizeCanvasToDisplaySize() {
      const dpr = window.devicePixelRatio || 1;
      const width = Math.round(canvas.clientWidth * dpr);
      const height = Math.round(canvas.clientHeight * dpr);
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
    }

    function render() {
      resizeCanvasToDisplaySize();
      gl.viewport(0, 0, canvas.width, canvas.height);

      // TODO(student): try changing these values
       // gl.clearColor(0.5, 0.75, 0.35, 0.65);
      // gl.clear(gl.COLOR_BUFFER_BIT);
      
    }
    let color = 0;
    function animate() {
        if (color === 0) {
            gl.clearColor(0.2, 0.23, 0.99, 0.5); // 0
        } else if (color === 1) {
            gl.clearColor(0.3, 0.3, 0.34, 0.5); // 1
        } else if (color === 2) {
            gl.clearColor(0.4, 0.1, 0.6, 0.5);  // 2
        }
    gl.clear(gl.COLOR_BUFFER_BIT);
    color++;
    if (color > 2) {
        color = 0;
    }
    }
    setInterval(animate, 1000);

    
    
    

    window.addEventListener("resize", render);
    render();
  </script>
</body>
</html>
